<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Paradoxify Fruits — 3D Arena</title>
<link rel="icon" href="1789648036939.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<!-- LOADING -->
<div id="loading">
  <div class="load-inner">
    <img src="1789648036939.jpg" alt="Paradoxify Fruits" class="load-art">
    <div class="load-title">PARADOXIFY <span>FRUITS</span></div>
    <div class="load-sub">3D ARENA • loading...</div>
    <div class="load-bar"><div id="load-fill"></div></div>
    <div id="load-status" class="load-status">conjuring fruits…</div>
  </div>
</div>

<!-- 3D CANVAS -->
<canvas id="game-canvas"></canvas>

<!-- FULLSCREEN FX OVERLAYS -->
<div id="vignette"></div>
<div id="flash"></div>
<div id="redshift"></div>
<div id="hitstop-veil"></div>
<div id="dmg-layer"></div>
<div id="ring-flash"></div>

<!-- HUD -->
<div id="hud">
  <div id="hud-topleft">
    <div id="hp-wrap">
      <div id="hp-bar"><div id="hp-fill"></div><span id="hp-text"></span></div>
      <div id="buff-row"></div>
      <div id="blade-charge-wrap" class="hidden"><div id="blade-charge-label">⚡ BLADE CHARGE</div><div id="blade-charge-bar"><div id="blade-charge-fill"></div></div></div>
    </div>
  </div>
  <div id="hud-topcenter">
    <div id="wave-banner">WAVE 1</div>
    <div id="stat-row"><span id="stat-kills">⚔ 0</span><span id="stat-enemies">👾 0</span><span id="stat-time">⏱ 0:00</span></div>
  </div>
  <div id="hud-topright">
    <div id="fps-counter" class="hidden">60 FPS</div>
    <div class="hud-btns">
      <button id="btn-skills-toggle" class="hud-btn" title="Toggle skill panel">🎯</button>
      <button id="btn-mute" class="hud-btn" title="Mute (M)">🔊</button>
      <button id="btn-help" class="hud-btn" title="Help (H)">❓</button>
      <button id="btn-settings" class="hud-btn" title="Graphics settings">⚙️</button>
    </div>
  </div>
  <div id="announce"></div>
  <div id="charge-hud" class="hidden"><div id="charge-label">CHARGING</div><div id="charge-bar"><div id="charge-fill"></div></div></div>
  <div id="channel-hud" class="hidden"><div id="channel-label">CHANNELING</div><div id="channel-bar"><div id="channel-fill"></div></div></div>
</div>

<!-- SKILL PANEL (middle right, compact, closable) -->
<div id="skill-panel">
  <div id="skill-panel-header">
    <span id="skill-panel-title">SKILLS</span>
    <button id="btn-close-skills" title="Close panel">✕</button>
  </div>
  <div class="skill-group-label" id="fruit-group-label">🟣 FRUIT <span id="fruit-name-mini"></span></div>
  <div id="fruit-skills"></div>
  <div class="skill-group-label" id="sword-group-label">🗡️ SWORD <span id="sword-name-mini"></span></div>
  <div id="sword-skills"></div>
  <div id="m1-row"><span id="m1-key">LMB</span><span id="m1-name">Punch</span><span id="m1-hint">basic attack</span></div>
</div>
<button id="skills-fab" class="hidden">🎯 SKILLS</button>

<!-- INVENTORY (square horizontal slots, bottom) -->
<div id="inventory">
  <div class="inv-slot" id="slot-fruit" title="Fruit slot — click to change">
    <div class="inv-icon" id="slot-fruit-icon">🍇</div>
    <div class="inv-tag">FRUIT</div>
    <div class="inv-name" id="slot-fruit-name">—</div>
  </div>
  <div class="inv-slot" id="slot-sword" title="Sword slot — click to change">
    <div class="inv-icon" id="slot-sword-icon">🗡️</div>
    <div class="inv-tag">SWORD</div>
    <div class="inv-name" id="slot-sword-name">—</div>
  </div>
</div>

<!-- PICKER MODAL -->
<div id="picker-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head"><span id="picker-title">EQUIP FRUIT</span><button class="modal-x" id="picker-x">✕</button></div>
    <div id="picker-list"></div>
    <button id="picker-unequip" class="wide-btn danger">UNEQUIP</button>
  </div>
</div>

<!-- SETTINGS MODAL (advanced graphics) -->
<div id="settings-modal" class="modal hidden">
  <div class="modal-box wide">
    <div class="modal-head"><span>⚙️ ADVANCED GRAPHICS SETTINGS</span><button class="modal-x" id="settings-x">✕</button></div>
    <div id="settings-body"></div>
    <div class="settings-foot">
      <button id="settings-reset" class="wide-btn">RESET DEFAULTS</button>
      <button id="settings-close" class="wide-btn primary">DONE</button>
    </div>
  </div>
</div>

<!-- HELP MODAL -->
<div id="help-modal" class="modal hidden">
  <div class="modal-box wide">
    <div class="modal-head"><span>❓ HOW TO PLAY</span><button class="modal-x" id="help-x">✕</button></div>
    <div id="help-body"></div>
    <div class="settings-foot"><button id="help-close" class="wide-btn primary">CLOSE</button></div>
  </div>
</div>

<!-- DEATH SCREEN -->
<div id="death-screen" class="hidden">
  <div class="death-inner">
    <div class="death-title">YOU DIED</div>
    <div id="death-stats" class="death-stats"></div>
    <button id="btn-respawn" class="wide-btn primary big">RESPAWN</button>
  </div>
</div>

<!-- TOUCH CONTROLS -->
<div id="touch-ui">
  <div id="joystick"><div id="joy-knob"></div></div>
  <button id="btn-fire">⚔️</button>
</div>

<!-- DAMAGE VIGNETTE for low HP -->
<div id="lowhp"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
